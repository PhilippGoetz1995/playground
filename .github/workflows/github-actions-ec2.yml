name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        id: build_images
        run: |
          docker compose -f docker-compose-prod.build.yml build

        # Notify if build failed
      - name: Slack (Build failed)
        if: failure() && steps.build_images.outcome == 'failure'
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            :x: *Build failed* for *${{ github.repository }}* on `${{ github.ref_name }}`
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>

      - name: Push Docker images to GHCR
        run: |
          docker compose 
      
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose file to EC2
        run: |
          scp docker-compose-prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/playground/docker-compose-prod.yml

      - name: SSH and deploy on EC2
        id: scp_compose
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            docker login ghcr.io -u ${{ secrets.GH_USERNAME }} -p ${{ secrets.GH_TOKEN }}
            docker-compose -f /home/ec2-user/playground/docker-compose-prod.yml pull
            docker-compose -f /home/ec2-user/playground/docker-compose-prod.yml up -d --remove-orphans
          EOF
      
      # Notify if SCP failed
      - name: Slack (Copy failed)
        if: failure() && steps.scp_compose.outcome == 'failure'
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            :x: *Copy to EC2 failed* (scp)
            Host: ${{ secrets.EC2_HOST }}
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>

      # Final summary (always runs)
      - name: Slack (Final status)
        if: always()
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            ${{ job.status == 'success' && ':white_check_mark: *CI passed*' || (job.status == 'cancelled' && ':warning: *CI cancelled*' || ':x: *CI failed*') }}
            Repo: *${{ github.repository }}* • Branch: `${{ github.ref_name }}`
            Actor: ${{ github.actor }}
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>