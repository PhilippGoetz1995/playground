name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      # Store version to id "ver" so that it can be used later with steps.ver.outputs.*
      - name: Create version and store it in variables
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_date=$DATE"     >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version.json
        run: |
          mkdir -p frontend/public
          cat > frontend/public/version.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "shortSha": "${{ steps.ver.outputs.short_sha }}",
            "builtAt": "${{ steps.ver.outputs.build_date }}"
          }
          EOF

      # --- bump package.json using npm version (explicit version)
      - name: Setup Node (for npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump package.json (explicit version)
        working-directory: frontend
        env:
          NEW_VERSION: "${{ steps.ver.outputs.version }}"
        run: |
          npm ci
          npm version "$NEW_VERSION" --no-git-tag-version

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: set package version to $NEW_VERSION [skip ci]" || echo "No changes"
          git push
      # --- end bump ---

      - name: Build Docker images
        id: build_images
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_DATE: ${{ steps.ver.outputs.build_date }}   # ISO-8601
        run: |
          docker compose -f docker-compose-prod.build.yml build

        # Notify if build failed
      - name: Slack (Build failed)
        if: failure() && steps.build_images.outcome == 'failure'
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            :x: *Build failed* for *${{ github.repository }}* on `${{ github.ref_name }}`
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>

      - name: Push Docker images to GHCR
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker compose -f docker-compose-prod.build.yml push
      
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose file to EC2
        run: |
          scp docker-compose-prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/playground/docker-compose-prod.yml

      - name: SSH and deploy on EC2
        id: scp_compose
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            docker login ghcr.io -u ${{ secrets.GH_USERNAME }} -p ${{ secrets.GH_TOKEN }}
            docker-compose -f /home/ec2-user/playground/docker-compose-prod.yml pull
            docker-compose -f /home/ec2-user/playground/docker-compose-prod.yml up -d --remove-orphans
          EOF
      
      # Notify if SCP failed
      - name: Slack (Copy failed)
        if: failure() && steps.scp_compose.outcome == 'failure'
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            :x: *Copy to EC2 failed* (scp)
            Host: ${{ secrets.EC2_HOST }}
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>

      # Final summary (always runs)
      - name: Slack (Final status)
        if: always()
        uses: Ilshidur/action-slack@2.0.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          args: |
            ${{ job.status == 'success' && ':white_check_mark: *CI passed*' || (job.status == 'cancelled' && ':warning: *CI cancelled*' || ':x: *CI failed*') }}
            Repo: *${{ github.repository }}* • Branch: `${{ github.ref_name }}`
            Actor: ${{ github.actor }}
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>